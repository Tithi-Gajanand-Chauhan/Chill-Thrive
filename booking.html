<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Book a Session | Chill Thrive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <!-- reuse your existing header here -->
</header>
<section class="booking-hero">

  <div class="booking-overlay"></div>

  <div class="booking-card">
    <h1>Book a Session</h1>
    <p>Reserve your recovery experience</p>

    <form class="booking-form" action="https://formspree.io/f/mvzzjrlo" method="POST">
      <input type="text" name="Full Name" placeholder="Full_Name" required id="fullname">
      <input type="email" name="Email" placeholder="Email_Address" required>
      <input type="tel" name="Phone" pattern="[0-9]{10}"  maxlength="10" title="Please enter a 10-digit mobile number"  placeholder="Mobile Number" 
       oninput="this.value = this.value.replace(/[^0-9]/g, '');" 
       required>
      
      <select name="Service" required>
        <option value=""disabled selected>Select Service</option>
        <option>Ice Bath</option>
        <option>Steam Bath</option>
        <option>Jacuzzi</option>
        <option>Full Recovery Combo</option>
      </select>

      <input type="date" name="Date" required>
      <input type="time" name="Time" required>

      <input type="hidden" name="_next" value="thankyou.html">

      <button type="submit" class="btn primary">Confirm Booking</button>
    </form>

    <p id="confirmation">✅ Your session has been booked!</p>
  </div>

</section>




</body>
</html>
